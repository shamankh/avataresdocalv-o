<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Avatares do Calvão — Prof. Christopher</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#141228;color:#fff;font-family:'Fredoka',sans-serif;padding:20px;}
h1{font-size:22px;color:#ffd93d;margin-bottom:4px;}
.sub{color:#9a93c4;font-size:13px;margin-bottom:20px;}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:12px;}
.card{background:#1d1b3a;border:3px solid #0d0a1f;border-radius:16px;box-shadow:4px 4px 0 #0d0a1f;padding:10px;text-align:center;transition:.1s;cursor:default;}
.card:hover{transform:translate(-2px,-2px);box-shadow:6px 6px 0 #0d0a1f;}
.card img{width:100%;height:100px;object-fit:contain;border-radius:8px;background:rgba(255,255,255,.05);}
.nome{font-weight:600;font-size:11px;margin-top:6px;color:#a78bfa;word-break:break-word;}
.ctx{font-size:9px;color:#5a6478;margin-top:3px;}
.erro{background:#3a1a1a;border:2px solid #fc6a6a;border-radius:10px;padding:14px;color:#fca5a5;font-size:13px;}
.load{color:#9a93c4;font-size:14px;}
</style>
</head>
<body>
<h1>🤖 Avatares do Calvão</h1>
<div class="sub">Prof. Me. Christopher De Andrade Cardoso · <a href="https://inspira.prof/" style="color:#a78bfa">inspira.prof</a></div>
<div class="grid" id="galeria"><div class="load">⏳ Carregando...</div></div>
<script>
async function carregar(){
  const gal = document.getElementById('galeria');
  try {
    const r = await fetch('manifest.json?t=' + Date.now());
    const data = await r.json();
    const base = data.base_url || '';
    if(!data.figurinhas?.length){ gal.innerHTML = '<div class="erro">Nenhuma figurinha no manifest.json.</div>'; return; }
    gal.innerHTML = data.figurinhas.map(f => `
      <div class="card">
        <img src="${base}${f.arquivo}" alt="${f.arquivo}" onerror="this.style.opacity='.3'">
        <div class="nome">${f.arquivo}</div>
        <div class="ctx">${(f.contextos||[]).slice(0,3).join(' · ')}</div>
      </div>`).join('');
  } catch(e){
    gal.innerHTML = '<div class="erro">Erro: ' + e.message + '</div>';
  }
}
carregar();
</script>
</body>
</html>
